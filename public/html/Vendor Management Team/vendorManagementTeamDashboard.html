<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
  <title>Vendor Management Dashboard</title>
  <!-- Raleway Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <!----======== CSS ======== -->
  <link rel="stylesheet" href="../css/adminDashboard.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
  <link rel="stylesheet" href="../../css/Admin Panel/adminCharts.css" />

  <!-- Google Fonts Link For Icons -->
  <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <script src="
    https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js
    "></script>
</head>

<body>
 <!-- Charts Container -->
 <div class="charts">
<!-- Charts Container -->
<div class="charts-container">
  <div class="frame">
      <canvas id="barChart"></canvas>
      <p class="chart-caption"><em>Sales Record</em></p>
  </div>
  <div class="frame">
      <canvas id="doughnutChart"></canvas>
      <p class="chart-caption"><em>Market share distribution</em></p>
  </div>
  <div class="frame">
      <canvas id="lineChart"></canvas>
      <p class="chart-caption"><em>Growth rate over the year</em></p>
  </div>
  <div class="frame">
      <canvas id="polarAreaChart"></canvas>
      <p class="chart-caption"><em>Product Category Preferences</em></p>
  </div>
  <div class="frame">
      <canvas id="radarChart"></canvas>
      <p class="chart-caption"><em>Performance Metrics</em></p>
  </div>
  <div class="frame">
      <canvas id="scatterChart"></canvas>
      <p class="chart-caption"><em>Customer Reviews based on Vendor Satisfaction</em></p>
  </div>
</div>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
  <section class="home"></section>


<!-- Chatbot Table -->
<class="show-chatbot">
  <button class="chatbot-toggler">
    <span class="material-symbols-rounded">mode_comment</span>
    <span class="material-symbols-outlined">close</span>
  </button>
  <div class="chatbot">
    <header>
      <h2>Vendhub Chatbot</h2>
      <span class="close-btn material-symbols-outlined">close</span>
    </header>
    <ul class="chatbox">
      <li class="chat incoming">
        <span class="material-symbols-outlined">smart_toy</span>
        <p>Hi there!<br />How can I help you today?</p>
      </li>
    </ul>
    <div class="chat-input">
      <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
      <span id="send-btn" class="material-symbols-rounded">send</span>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../../js/adminCharts.js"></script>
  </body>

</html>
