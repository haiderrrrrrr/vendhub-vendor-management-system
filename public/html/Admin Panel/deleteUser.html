<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
    <title>Delete User</title>
    <!-- Raleway Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <!----======== CSS ======== -->
    <link rel="stylesheet" href="../../css/adminDashboard.css" />
    <link rel="stylesheet" href="../../css/chatbot.css" />
    <link rel="stylesheet" href="../../css/error.css" />
    <link rel="stylesheet" href="../../css/Admin Panel/deleteUser.css" />

    <!-- Google Fonts Link For Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>

<body>
    <h1>Delete User</h1>
    <form id="delete-user-form">
        <!-- User Selection -->
        <label for="user-select" class="form-label">Select User *</label>
        <select name="user_id" id="user-select" class="form-input" required>
            <option value="">Select User</option>
            <!-- Users will be populated here -->
        </select>
      
        <!-- User Information (readonly, not editable) -->
        <input type="text" id="username" placeholder="Username" class="form-input" required disabled />
        <input type="email" id="email" placeholder="Email" class="form-input" required disabled />
      
        <!-- Delete Button -->
        <button type="submit" class="button">Delete User</button>
    </form>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
      <section class="home"></section>
    


    <!-- Error Message -->
    <div id="error-message" class="error-container">
        <span id="error-text"></span>
        <span class="close-btn" onclick="closeError()">×</span>
      </div>
  
    <!-- Chatbot Table -->
    <div class="show-chatbot">
        <button class="chatbot-toggler">
            <span class="material-symbols-rounded">mode_comment</span>
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="chatbot">
            <header>
                <h2>Vendhub Chatbot</h2>
                <span class="close-btn material-symbols-outlined">close</span>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <p>Hi there!<br />How can I help you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
                <span id="send-btn" class="material-symbols-rounded">send</span>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../js/api.js"></script>
<script src="../../js/chatbot.js"></script>
<script src="../../js/deleteUser.js"></script>
<script src="../../js/error.js"></script>
</body>

</html>
