<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
    <title>Update Contract</title>
    <!-- Raleway Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <!----======== CSS ======== -->
    <link rel="stylesheet" href="../../css/adminDashboard.css" />
    <link rel="stylesheet" href="../../css/chatbot.css" />
    <link rel="stylesheet" href="../../css/error.css" />
    <link rel="stylesheet" href="../../css/Admin Panel/updateContract.css" />

    <!-- Google Fonts Link For Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>

<body>
    <h1>Update Contract</h1>
    <form id="contract-form">
        <!-- Contract Name Dropdown -->
        <label for="contract_name" class="form-label">Select Contract *</label>
        <select name="contract_id" id="contract_name" class="form-input" required onchange="fetchContractDetails(this.value)">
            <option value="">Select Contract</option>
            <!-- Contracts will be populated here via JavaScript -->
        </select>
    
        <!-- Vendor Selection -->
        <label for="vendor" class="form-label">Select Vendor *</label>
        <select name="vendor_id" id="vendor" class="form-input" required>
            <option value="">Select Vendor</option>
            <!-- Vendors will be populated here -->
        </select>
    
        <!-- Contract Name (Auto-filled after contract selection) -->
        <label for="contract_name_input" class="form-label">Contract Name *</label>
        <input type="text" id="contract_name_input" name="contract_name" placeholder="Enter contract name" class="form-input" required />
    
        <!-- Contract Terms -->
        <label for="contract_terms" class="form-label">Contract Terms *</label>
        <textarea id="contract_terms" name="contract_terms" placeholder="Enter contract terms" class="form-input" required></textarea>
    
        <!-- Contract Start Date -->
        <label for="start_date" class="form-label">Start Date *</label>
        <input type="date" id="start_date" name="start_date" class="form-input" required />
    
        <!-- Contract End Date -->
        <label for="end_date" class="form-label">End Date *</label>
        <input type="date" id="end_date" name="end_date" class="form-input" required />
    
        <!-- Contract Value -->
        <label for="contract_value" class="form-label">Contract Value *</label>
        <input type="number" id="contract_value" name="contract_value" class="form-input" required min="0" step="0.01" />
    
        <!-- Payment Terms -->
        <label for="payment_terms" class="form-label">Payment Terms *</label>
        <textarea id="payment_terms" name="payment_terms" placeholder="Enter payment terms" class="form-input" required></textarea>
    
        <!-- Submit Button -->
        <button type="submit" class="button">Update Contract</button>
    </form>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
      <section class="home"></section>
    



    <!-- Error Message -->
    <div id="error-message" class="error-container">
        <span id="error-text"></span>
        <span class="close-btn" onclick="closeError()">×</span>
      </div>
  
    <!-- Chatbot Table -->
    <div class="show-chatbot">
        <button class="chatbot-toggler">
            <span class="material-symbols-rounded">mode_comment</span>
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="chatbot">
            <header>
                <h2>Vendhub Chatbot</h2>
                <span class="close-btn material-symbols-outlined">close</span>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <p>Hi there!<br />How can I help you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
                <span id="send-btn" class="material-symbols-rounded">send</span>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../js/api.js"></script>
<script src="../../js/chatbot.js"></script>
<script src="../../js/updateContract.js"></script>
<script src="../../js/error.js"></script>
</body>

</html>
