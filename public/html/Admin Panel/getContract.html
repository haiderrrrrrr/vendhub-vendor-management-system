<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
    <title>Get Contracts</title>
    <!-- Raleway Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <!----======== CSS ======== -->
    <!-- <link rel="stylesheet" href="../../css/adminDashboard.css" /> -->
    <link rel="stylesheet" href="../../css/chatbot.css" />
    <link rel="stylesheet" href="../../css/error.css" />
    <link rel="stylesheet" href="../../css/Admin Panel/getContract.css" />

    <!-- Google Fonts Link For Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>

<body>
    <h1>Get Contracts</h1>

    <!-- Container for dropdown and buttons -->
    <div class="container">
        <!-- Dropdown to Select a Contract -->
        <label for="contract-dropdown" class="label">Select Contract:</label>
        <select id="contract-dropdown" class="button" style="width: 100%;">
            <option value="">--Select a Contract--</option>
            <!-- Contract options will be populated dynamically -->
        </select>

        <!-- Buttons to Fetch Details and Generate Report -->
        <button id="get-contract-details-btn" class="button" style="width: 100%;">Get Contract Details</button>
        <button id="generate-report-btn" class="button" style="width: 100%; margin-top: 10px;">Generate Report</button>
        
        <!-- Contract Details Section (Initially Hidden) -->
        <div id="contract-details" class="report-section">
          <div class="contract-details">
            <h2>Contract Details</h2>
            <p><span class="label">Contract Name:</span> <span id="contract-name" class="value"></span></p>
            <p><span class="label">Contract Terms:</span> <span id="contract-terms" class="value"></span></p>
            <p><span class="label">Start Date:</span> <span id="contract-start-date" class="value"></span></p>
            <p><span class="label">End Date:</span> <span id="contract-end-date" class="value"></span></p>
            <p><span class="label">Status:</span> <span id="contract-status" class="value"></span></p>
            <p><span class="label">Contract Value:</span> $<span id="contract-value" class="value"></span></p>
            <p><span class="label">Payment Terms:</span> <span id="contract-payment-terms" class="value"></span></p>
            <p><span class="label">Amendments:</span> <span id="contract-amendments" class="value"></span></p>
          </div>
        </div>
      </div>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
      <section class="home"></section>
    


    <!-- Error Message -->
    <div id="error-message" class="error-container">
        <span id="error-text"></span>
        <span class="close-btn" onclick="closeError()">×</span>
      </div>
  
    <!-- Chatbot Table -->
    <div class="show-chatbot">
        <button class="chatbot-toggler">
            <span class="material-symbols-rounded">mode_comment</span>
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="chatbot">
            <header>
                <h2>Vendhub Chatbot</h2>
                <span class="close-btn material-symbols-outlined">close</span>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <p>Hi there!<br />How can I help you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
                <span id="send-btn" class="material-symbols-rounded">send</span>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../js/api.js"></script>
<script src="../../js/chatbot.js"></script>
<script src="../../js/getContract.js"></script>
<script src="../../js/error.js"></script>
</body>

</html>
