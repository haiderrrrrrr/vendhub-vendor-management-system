<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
    <title>Get Budget</title>
    <!-- Raleway Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <!----======== CSS ======== -->
    <link rel="stylesheet" href="../../css/adminDashboard.css" />
    <link rel="stylesheet" href="../../css/chatbot.css" />
    <link rel="stylesheet" href="../../css/error.css" />
    <link rel="stylesheet" href="../../css/Admin Panel/getBudget.css" />

    <!-- Google Fonts Link For Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>

<body>
    <h1 style="text-align: center;">Budget Report</h1>

    <!-- Container for the Card -->
    <div id="budget-report-card-container" class="card-container" style="display: none;">
    
        <!-- Card to Display Department and Budget Report -->
        <div class="card">
            <h2 class="card-title">Department Budget Report</h2>
    
            <!-- Department Selection Dropdown -->
            <label for="department-select" class="form-label">Select Department *</label>
            <select id="department-select" class="form-input" required>
                <option value="">Select Department</option>
                <!-- Department names will be populated here dynamically -->
            </select>
            
            <br>
    
            <!-- Buttons to Fetch Budget Report and Generate PDF Report -->
            <button id="get-budget-report-btn" class="button">Get Budget Report</button>
            <button id="generate-report-btn" class="button">Generate PDF Report</button>
    
            <!-- Department and Budget Report Details -->
            <div id="department-budget-details" class="budget-details" style="display: none;">
                <p><strong>Department Name:</strong> <span id="department-name"></span></p>
                <p><strong>Allocated Amount:</strong> <span id="allocated-amount"></span></p>
                <p><strong>Spent Amount:</strong> <span id="spent-amount"></span></p>
                <p><strong>Remaining Amount:</strong> <span id="remaining-amount"></span></p>
                <p><strong>Year:</strong> <span id="year"></span></p>
            </div>
        </div>
    
    </div>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
      <section class="home"></section>
    

    <!-- Error Message -->
    <div id="error-message" class="error-container">
        <span id="error-text"></span>
        <span class="close-btn" onclick="closeError()">×</span>
      </div>
  
    <!-- Chatbot Table -->
    <div class="show-chatbot">
        <button class="chatbot-toggler">
            <span class="material-symbols-rounded">mode_comment</span>
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="chatbot">
            <header>
                <h2>Vendhub Chatbot</h2>
                <span class="close-btn material-symbols-outlined">close</span>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <p>Hi there!<br />How can I help you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
                <span id="send-btn" class="material-symbols-rounded">send</span>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../js/api.js"></script>
<script src="../../js/chatbot.js"></script>
<script src="../../js/getBudget.js"></script>
<script src="../../js/error.js"></script>
</body>

</html>
