<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../assets/fav-icon.png" />
    <title>Track Performance Evaluation</title>
    <!-- Raleway Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <!----======== CSS ======== -->
    <link rel="stylesheet" href="../../css/adminDashboard.css" />
    <link rel="stylesheet" href="../../css/chatbot.css" />
    <link rel="stylesheet" href="../../css/error.css" />
    <link rel="stylesheet" href="../../css/Admin Panel/getRating.css" />

    <!-- Google Fonts Link For Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
</head>

<body>
    <h1 style="text-align: center;">Track Vendor Performance Evaluations</h1>

    <!-- Container for the Card -->
    <div id="performance-card-container" class="card-container" style="display: none;">
    
        <!-- Card to Display Performance Evaluation -->
        <div class="card">
            <h2 class="card-title">Performance Evaluation Report</h2>
    
            <!-- Vendor Selection Dropdown -->
            <label for="vendor-select" class="form-label">Select Vendor *</label>
            <select id="vendor-select" class="form-input" required>
                <option value="">Select Vendor</option>
                <!-- Vendor names will be populated here dynamically -->
            </select>
            
            <br>
    
            <!-- Buttons to Fetch Performance Evaluations and Generate PDF Report -->
            <button id="get-performance-btn" class="button">Get Performance</button>
            <button id="generate-report-btn" class="button">Generate Report</button>
    
            <!-- Performance Evaluation Details -->
            <div id="performance-evaluation-details" class="performance-details" style="display: none;">
                <p><strong>Vendor:</strong> <span id="vendor-name"></span></p>
                <p><strong>Rating:</strong> <span id="performance-rating"></span></p>
                <p><strong>Feedback:</strong> <span id="feedback-text"></span></p>
                <p><strong>Improvement Notes:</strong> <span id="improvement-notes"></span></p>
                <p><strong>Evaluation Date:</strong> <span id="evaluation-date"></span></p>
                <p><strong>Evaluator:</strong> <span id="evaluator-name"></span></p>
            </div>
        </div>
    
    </div>
  <div id="sidebar-mount"></div>
  <script src="../../js/sidebar.js"></script>
    <section class="home"></section>
  



    <!-- Error Message -->
    <div id="error-message" class="error-container">
        <span id="error-text"></span>
        <span class="close-btn" onclick="closeError()">×</span>
      </div>
  
    <!-- Chatbot Table -->
    <div class="show-chatbot">
        <button class="chatbot-toggler">
            <span class="material-symbols-rounded">mode_comment</span>
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="chatbot">
            <header>
                <h2>Vendhub Chatbot</h2>
                <span class="close-btn material-symbols-outlined">close</span>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <p>Hi there!<br />How can I help you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false" required></textarea>
                <span id="send-btn" class="material-symbols-rounded">send</span>
            </div>
        </div>
    </div>
</body>

</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../js/api.js"></script>
<script src="../../js/chatbot.js"></script>
<script src="../../js/getRating.js"></script>
<script src="../../js/error.js"></script>
</body>

</html>
